<h1 class="- topic/title title topictitle1" id="GUID-4E1E40CC-D919-406F-8B1A-C86DA89A235B__GUID-60987D79-8D31-42EC-B0ED-1069DF5F5953" style="">15.2.1 WWDT Is Always On</h1>
<div class="- topic/body body">
<p class="- topic/p p">When the WDTE Configuration bits are set to <code class="+ topic/ph pr-d/codeph ph codeph">‘b11</code>, the WWDT is always on. WWDT
            protection is active during Sleep.</p>
