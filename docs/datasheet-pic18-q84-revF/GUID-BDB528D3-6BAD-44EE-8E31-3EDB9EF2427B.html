<h1 class="- topic/title title topictitle1" id="GUID-BDB528D3-6BAD-44EE-8E31-3EDB9EF2427B__GUID-F5B33C77-E0F8-49F9-8B24-BC00A7AE0B5C" style="">22.3 Effects of a Reset</h1>
<div class="- topic/body body">
<p class="- topic/p p">The CLCnCON register is cleared to ‘<code class="+ topic/ph pr-d/codeph ph codeph">0</code>’ as the
            result of a Reset. All other selection and gating values remain unchanged.</p>
